[[provides]]
name = "config-shape"
summary = "The shared window → group → tab config shape: the Window/Group container, a house-style TOML formatter (and the shared `fmt` CLI subcommand curator, warden and lector delegate to), #rgb/#rrggbb accent parsing, window validation, comment-preserving structural edits of windows, groups, tabs and root keys, and the login-session cascade. Not a generic config framework — each app keeps its own leaf model and leaf validation."
[[provides]]
name = "config-path-seed"
summary = "resolve_config_path()/default_config_path() — the identical $ENV-override-else-~/.config/<app>/config.toml resolution every app uses — and write_default_config(), an atomic, never-clobbering starter-config writer an app calls only on a user click (shell-core's home surface), never automatically."
