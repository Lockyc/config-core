[github]
topics_extra = ["library"]
description = "The shared config layer behind warden, curator, lector and flotilla — the window → group → tab container and its validation, comment-preserving edits of windows, groups and tabs, the house TOML formatter, the login-session cascade, config-path resolution, accent colours, project-root discovery and an on-request starter config."
